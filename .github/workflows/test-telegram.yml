name: Temporary Telegram bot test

on:
  push:
    branches: [codex/bgmu-github-test]
    paths:
      - .github/workflows/test-telegram.yml
      - tools/github_test_session.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bgmu-temporary-telegram-test
  cancel-in-progress: true

jobs:
  test-bot:
    if: github.actor != 'github-actions[bot]' && github.ref == 'refs/heads/codex/bgmu-github-test'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Temporary bot test disabled by owner
        run: python -c "print('Both temporary Telegram bots are disabled; no polling will start.')"
